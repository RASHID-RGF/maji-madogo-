  <rect x="620" y="330" width="510" height="290" rx="18" fill="#ffffff" stroke="#dfeaf5"/>
  <text x="650" y="365" font-size="26" font-family="Arial, sans-serif" font-weight="700" fill="#123b5b">Issue mix</text>
  <circle cx="760" cy="530" r="110" fill="none" stroke="#e5e7eb" stroke-width="70"/>
  <circle cx="760" cy="530" r="110" fill="none" stroke="#1d4ed8" stroke-width="70" stroke-dasharray="270 220" stroke-linecap="round" transform="rotate(-90 760 530)"/>
  <circle cx="760" cy="530" r="110" fill="none" stroke="#0a7e61" stroke-width="70" stroke-dasharray="120 370" stroke-linecap="round" transform="rotate(30 760 530)"/>
  <circle cx="760" cy="530" r="110" fill="none" stroke="#f59e0b" stroke-width="70" stroke-dasharray="90 400" stroke-linecap="round" transform="rotate(95 760 530)"/>
  <text x="880" y="490" font-size="18" font-family="Arial, sans-serif" fill="#49667a">Pumps: 42%</text>
  <text x="880" y="520" font-size="18" font-family="Arial, sans-serif" fill="#49667a">Pipelines: 31%</text>
  <text x="880" y="550" font-size="18" font-family="Arial, sans-serif" fill="#49667a">Power: 17%</text>
  <text x="880" y="580" font-size="18" font-family="Arial, sans-serif" fill="#49667a">Access: 10%</text>
