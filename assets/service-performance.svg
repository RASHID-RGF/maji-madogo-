<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#edf5ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="70" y="70" font-size="32" font-family="Arial, sans-serif" font-weight="700" fill="#123b5b">Service performance dashboard</text>
  <text x="70" y="108" font-size="18" font-family="Arial, sans-serif" fill="#4a6277">Operational Health Overview</text>

  <rect x="70" y="150" width="250" height="120" rx="14" fill="#ffffff" stroke="#dfeaf5"/>
  <text x="95" y="190" font-size="16" font-family="Arial, sans-serif" fill="#5b7285">Water point uptime</text>
  <text x="95" y="240" font-size="42" font-family="Arial, sans-serif" font-weight="700" fill="#0a7e61">81%</text>
  <text x="95" y="260" font-size="14" font-family="Arial, sans-serif" fill="#64839d">Target 90%</text>

  <rect x="350" y="150" width="250" height="120" rx="14" fill="#ffffff" stroke="#dfeaf5"/>
  <text x="375" y="190" font-size="16" font-family="Arial, sans-serif" fill="#5b7285">Avg. repair time</text>
  <text x="375" y="240" font-size="42" font-family="Arial, sans-serif" font-weight="700" fill="#d97706">6.4 days</text>
  <text x="375" y="260" font-size="14" font-family="Arial, sans-serif" fill="#64839d">Down from 8.1</text>

  <rect x="630" y="150" width="250" height="120" rx="14" fill="#ffffff" stroke="#dfeaf5"/>
