  <text x="655" y="240" font-size="42" font-family="Arial, sans-serif" font-weight="700" fill="#b91c1c">23</text>
  <text x="655" y="260" font-size="14" font-family="Arial, sans-serif" fill="#64839d">Need intervention</text>

  <rect x="910" y="150" width="220" height="120" rx="14" fill="#ffffff" stroke="#dfeaf5"/>
  <text x="935" y="190" font-size="16" font-family="Arial, sans-serif" fill="#5b7285">Coverage gap</text>
  <text x="935" y="240" font-size="42" font-family="Arial, sans-serif" font-weight="700" fill="#1d4ed8">17%</text>
  <text x="935" y="260" font-size="14" font-family="Arial, sans-serif" fill="#64839d">Priority areas</text>

  <rect x="70" y="330" width="520" height="290" rx="18" fill="#ffffff" stroke="#dfeaf5"/>
  <text x="100" y="365" font-size="26" font-family="Arial, sans-serif" font-weight="700" fill="#123b5b">Maintenance backlog by region</text>
  <g transform="translate(90,410)">
    <rect x="0" y="60" width="70" height="150" fill="#60a5fa"/>
    <rect x="90" y="100" width="70" height="110" fill="#93c5fd"/>
    <rect x="180" y="80" width="70" height="130" fill="#60a5fa"/>
    <rect x="270" y="20" width="70" height="190" fill="#1d4ed8"/>
    <rect x="360" y="120" width="70" height="90" fill="#bfdbfe"/>
    <text x="18" y="230" font-size="18" font-family="Arial, sans-serif" fill="#49667a">North</text>
    <text x="108" y="230" font-size="18" font-family="Arial, sans-serif" fill="#49667a">East</text>
    <text x="198" y="230" font-size="18" font-family="Arial, sans-serif" fill="#49667a">West</text>
    <text x="288" y="230" font-size="18" font-family="Arial, sans-serif" fill="#49667a">South</text>
    <text x="378" y="230" font-size="18" font-family="Arial, sans-serif" fill="#49667a">Coast</text>
